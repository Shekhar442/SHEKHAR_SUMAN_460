<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" fill="none">
  <style>
    @media (prefers-color-scheme: light) {
      .mark-bg { fill: #1e40af; }
      .mark-fg { fill: #eff6ff; }
      .name { fill: #1e3a8a; }
      .tag { fill: #1d4ed8; }
    }
    @media (prefers-color-scheme: dark) {
      .mark-bg { fill: #60a5fa; }
      .mark-fg { fill: #1e3a8a; }
      .name { fill: #eff6ff; }
      .tag { fill: #93c5fd; }
    }
  </style>
  <rect class="mark-bg" x="0" y="4" width="40" height="40" rx="10" />
  <text
    x="20"
    y="24"
    dominant-baseline="central"
    text-anchor="middle"
    class="mark-fg"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="700">SS</text>
  <text
    x="52"
    y="17"
    class="name"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="16"
    font-weight="700">Shekhar Suman</text>
  <text
    x="52"
    y="34"
    class="tag"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="11"
    font-weight="500"
    opacity="0.92">AI &amp; Machine Learning</text>
</svg>
